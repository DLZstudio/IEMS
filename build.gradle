plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang 在 1.21.1 中向终端用户分发 Java 21，模组应面向 Java 21 编译。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    client {
        modSource sourceSets.main
        runType 'client'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        modSource sourceSets.main
        runType 'server'
        arguments '--nogui'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    gameTestServer {
        modSource sourceSets.main
        runType 'gameTestServer'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    datagen {
        modSource sourceSets.main
        runType 'data'
        arguments '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
    }
}

repositories {
    // M10 单测基线（V-13）：JUnit 5 依赖走 Maven Central
    mavenCentral()
    // NeoForge 依赖走国内镜像仓库（mirror.zcswo.cn），官方源兜底（2026-09-16：
    // 镜像 502 故障期间官方源已可直连，双源保证构建韧性）
    maven {
        name = "NeoForged Mirror"
        url = uri("https://mirror.zcswo.cn/neoforge/releases")
        content {
            includeGroup "net.neoforged"
        }
    }
    maven {
        name = "NeoForged Official"
        url = uri("https://maven.neoforged.net/releases")
        content {
            includeGroup "net.neoforged"
            includeGroup "net.neoforged.fancymodloader"
            includeGroup "cpw.mods"
        }
    }
    // GeckoLib 官方 Maven 仓库（中继器/广播塔 3D 模型渲染）
    maven {
        name = "GeckoLib"
        url = uri("https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/")
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup "com.eliotlash.mclib"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // GeckoLib：示例设备（能源传输中继器 / 能源广播塔）的 3D 模型渲染
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"

    // M10 单测基线（V-13）：JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// M10 单测基线（V-13）：Windows 下 JDK launcher 按 sun.jnu.encoding(GBK) 解码
// @argfile 传入的 classpath，含中文路径（F:\备份\...）的条目会被损坏，导致测试类
// ClassNotFoundException。解法：将 test runtime classpath 全量同步到纯 ASCII 目录，
// 使 test worker 的 classpath 不包含任何中文路径。
def asciiTestCpDir = file("${System.getProperty('user.home')}/.gradle/caches/iems-test-cp")

tasks.register('syncTestClasspath', Sync) {
    group = 'verification'
    description = 'Sync test runtime classpath into an ASCII-only directory.'
    from configurations.testRuntimeClasspath
    from sourceSets.main.output
    from sourceSets.test.output
    into asciiTestCpDir
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('syncTestClasspath')
    // 类目录 + 平铺的 jar 共同构成纯 ASCII classpath
    classpath = files(asciiTestCpDir) + files(fileTree(asciiTestCpDir).matching { include '**/*.jar' }.files)
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// 展开 neoforge.mods.toml 中的 ${} 占位符。
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
