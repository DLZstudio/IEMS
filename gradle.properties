# Gradle 运行参数
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# 使用本地 JDK 21 编译（toolchain 自动发现）
org.gradle.java.installations.paths=D:/Java/jdk-21

# 环境版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

# 模组属性
mod_id=iems
mod_name=IEMS
mod_license=All Rights Reserved
mod_version=0.8.0-beta
mod_group_id=com.iems
mod_authors=DLZstudio
mod_description=Integrated Energy Management System - 面向 Minecraft NeoForge 的综合能源管理系统

# 网络代理（本机环境，如无需代理可删除以下 5 行；建议迁移到用户级 ~/.gradle/gradle.properties）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*
