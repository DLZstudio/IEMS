# Gradle 运行参数
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# 使用本地 JDK 21 编译（toolchain 自动发现）
org.gradle.java.installations.paths=D:/Java/jdk-21

# 环境版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.230
# GeckoLib（中继器/广播塔 3D 模型渲染）
geckolib_version=4.8.4
# 运行时最低支持的 NeoForge 版本（用于 neoforge.mods.toml 依赖范围）。
# 编译仍用 neo_version（21.1.230）；此下限基于 IEMS 实际使用的 API（均为 21.1 系列早期稳定 API）放宽到 21.1.0。
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# 模组属性
mod_id=iems
mod_name=IEMS
mod_license=MIT
mod_version=0.8.0-beta
mod_group_id=com.iems
mod_authors=DLZstudio
# 注意：Gradle 以 ISO-8859-1 读取 gradle.properties，非 ASCII 必须写成 \uXXXX 转义，
# 否则中文会被双重编码（展开进 neoforge.mods.toml 后呈乱码）。
mod_description=Integrated Energy Management System - \u9762\u5411 Minecraft NeoForge \u7684\u7EFC\u5408\u80FD\u6E90\u7BA1\u7406\u7CFB\u7EDF

# 网络代理（本机环境，如无需代理可删除以下 5 行；建议迁移到用户级 ~/.gradle/gradle.properties）
# 2026-09-22：本机代理（127.0.0.1:7897）未运行，已临时注释；官方源 maven.neoforged.net 直连可达。
# 代理恢复后如需走代理，取消下面 5 行注释即可。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.*
